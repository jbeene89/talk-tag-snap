name: Android release

# Builds a signed Android App Bundle (.aab) and uploads it to Google Play.
#
# Two ways to run it:
#   1. Push a version tag, e.g.  git tag v1.4.0 && git push origin v1.4.0
#   2. Actions tab → "Android release" → Run workflow (pick the track)
#
# Required repository secrets (Settings → Secrets and variables → Actions).
# See docs/RELEASING.md for step-by-step instructions on getting each one:
#   ANDROID_KEYSTORE_BASE64     - base64 of your upload keystore (.jks/.keystore)
#   ANDROID_KEYSTORE_PASSWORD   - the keystore (store) password
#   ANDROID_KEY_ALIAS           - the key alias inside the keystore
#   ANDROID_KEY_PASSWORD        - the key password for that alias
#   PLAY_SERVICE_ACCOUNT_JSON   - full JSON of a Play Console service account
#
# The signed .aab is always saved as a workflow artifact, so even without the
# Play secret you get a file you can upload to Play Console by hand.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track to publish to"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: "Release status on that track"
        type: choice
        default: completed
        options: [completed, draft]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install (not `npm ci`) so a package-lock.json that has drifted out
        # of sync with package.json — the Lovable toolchain updates deps without
        # always refreshing the lockfile — reconciles instead of hard-failing.
        run: npm install --no-audit --no-fund

      - name: Build web bundle + sync Android
        run: npm run sync:android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot sign the release. See docs/RELEASING.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/upload.keystore"

      - name: Build signed AAB
        working-directory: android
        env:
          SOUPYTAG_STORE_FILE: ${{ github.workspace }}/android/app/upload.keystore
          SOUPYTAG_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SOUPYTAG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SOUPYTAG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: soupytag-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish to Google Play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        if: ${{ env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.soupytag.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'completed' }}
          whatsNewDirectory: distribution/whatsnew

      - name: Play upload skipped notice
        if: ${{ env.PLAY_JSON == '' }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set — skipped Play upload. Download the 'soupytag-release-aab' artifact and upload it in Play Console manually."
